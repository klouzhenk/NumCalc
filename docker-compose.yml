services:
  db:
    image: mcr.microsoft.com/mssql/server:2022-latest
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: ${SA_PASSWORD}
      MSSQL_PID: Express
    ports:
      - "1433:1433"
    volumes:
      - mssql-data:/var/opt/mssql
    healthcheck:
      test: ['CMD-SHELL', '/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P "$$MSSQL_SA_PASSWORD" -No -C -Q "SELECT 1" || exit 1']
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

  calc-api:
    build:
      context: .
      dockerfile: NumCalc.Calculation.Api/Dockerfile
    ports:
      - "5229:8080"
    environment:
      OcrSettings__GeminiApiKey: ${GEMINI_API_KEY:-}

  user-api:
    build:
      context: .
      dockerfile: NumCalc.User.API/Dockerfile
    ports:
      - "5230:8080"
    environment:
      ConnectionStrings__DefaultConnection: "Server=db,1433;Database=NumCalcUsers;User Id=sa;Password=${SA_PASSWORD};TrustServerCertificate=True"
      JWT__Secret: ${JWT_SECRET}
      JWT__Issuer: NumCalc
      JWT__Audience: NumCalc
      JWT__ExpiryDays: "7"
      EmailSettings__Smtp__Host: ${SMTP_HOST:-smtp.gmail.com}
      EmailSettings__Smtp__Port: ${SMTP_PORT:-587}
      EmailSettings__Smtp__Username: ${SMTP_USERNAME:-}
      EmailSettings__Smtp__Password: ${SMTP_PASSWORD:-}
      EmailSettings__Smtp__FromAddress: ${SMTP_FROM_ADDRESS:-}
      EmailSettings__Smtp__FromName: ${SMTP_FROM_NAME:-NumCalc}
      EmailSettings__Smtp__UseSsl: ${SMTP_USE_SSL:-true}
      WebApp__BaseUrl: ${WEB_BASE_URL:-http://localhost:8080}
    depends_on:
      db:
        condition: service_healthy

  web:
    build:
      context: .
      dockerfile: NumCalc.UI.Web/Dockerfile
    ports:
      - "8080:8080"
    environment:
      Apis__CalculationApi__BaseUrl: http://calc-api:8080
      Apis__UserApi__BaseUrl: http://user-api:8080
    volumes:
      - dp-keys:/root/.aspnet/DataProtection-Keys
    depends_on:
      - calc-api
      - user-api

volumes:
  mssql-data:
  dp-keys:
